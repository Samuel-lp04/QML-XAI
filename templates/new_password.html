<!doctype html>
<html lang="es">

<head>
  <title>Nueva Contraseña - QML-XAI</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/session.css') }}">
</head>

<body>
  <div class="container-fluid p-0 vh-100">
    <div class="row g-0 h-100">
      <div class="col-md-6 d-none d-md-flex flex-column panel-morado p-5">
        <div class="flex-grow-1 d-flex justify-content-center align-items-start pt-5 mt-4">
          <img src="{{ url_for('static', filename='img/NN neon.png') }}" class="img-fluid" style="max-width: 65%;"
            alt="Red Neuronal">
        </div>
        <div class="position-absolute top-0 end-0 p-3 mt-2 me-2" style="z-index: 1050;">
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          {% for category, message in messages %}
          <div
            class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show shadow-sm rounded"
            role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          {% endfor %}
          {% endif %}
          {% endwith %}
        </div>
        <div class="mt-auto text-white pb-3">
          <h1 class="fw-bold mb-3">Seguridad</h1>
          <p class="fs-6 m-0">Elige una contraseña fuerte que no hayas usado antes.</p>
        </div>
      </div>
      <div class="col-md-6 d-flex align-items-center justify-content-center bg-gris-claro p-4">
        <div class="bg-white shadow tarjeta-blanca p-5">
          <h4 class="text-center mb-4 fw-bold">Nueva contraseña</h4>
          <form method="POST">
            <div class="mb-4">
              <label class="form-label">Escribe tu nueva contraseña</label>
              <input type="password" name="password" class="form-control text-center input-clasico" required />
            </div>
            <div class="d-flex flex-column align-items-center gap-3">
              <button type="submit" class="btn btn-gris-sombra rounded-pill">Actualizar contraseña</button>
            </div>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          </form>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
